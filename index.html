<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free Fire UID Checker</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: radial-gradient(circle at top,#5b0b18,#160308 55%,#050105);
    color:white;
    padding:20px;
}

.container{
    width:100%;
    max-width:480px;
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.15);
    border-radius:25px;
    padding:30px;
    backdrop-filter:blur(20px);
    box-shadow:0 20px 60px rgba(0,0,0,.6);
}

.logo{
    text-align:center;
    font-size:35px;
    font-weight:900;
    margin-bottom:5px;
}

.subtitle{
    text-align:center;
    color:#aaa;
    margin-bottom:25px;
}

input, select{
    width:100%;
    padding:15px;
    border:none;
    outline:none;
    border-radius:12px;
    background:rgba(255,255,255,.1);
    color:white;
    font-size:15px;
}

select{
    margin-top:12px;
}

option{
    background:#1b0710;
}

button{
    width:100%;
    margin-top:15px;
    padding:15px;
    border:none;
    border-radius:12px;
    background:linear-gradient(135deg,#ff1744,#ff5722);
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 25px rgba(255,23,68,.35);
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.loader{
    display:none;
    text-align:center;
    margin:25px 0;
}

.spinner{
    width:35px;
    height:35px;
    border:4px solid rgba(255,255,255,.2);
    border-top-color:#ff1744;
    border-radius:50%;
    animation:spin 1s linear infinite;
    margin:auto;
}

@keyframes spin{
    to{ transform:rotate(360deg); }
}

.error{
    display:none;
    margin-top:20px;
    padding:15px;
    border-radius:12px;
    background:rgba(255,0,60,.12);
    border:1px solid rgba(255,0,60,.4);
    color:#ff8da5;
    text-align:center;
    font-size:14px;
    line-height:1.5;
}

.profile{
    display:none;
    margin-top:25px;
    padding:20px;
    border-radius:20px;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.1);
    animation:fade .5s ease;
}

@keyframes fade{
    from{ opacity:0; transform:translateY(15px); }
    to{ opacity:1; transform:translateY(0); }
}

.avatar{
    width:90px;
    height:90px;
    margin:auto;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:42px;
    background:linear-gradient(135deg,#ff1744,#ff9800);
    box-shadow:0 0 30px rgba(255,23,68,.4);
}

.player-name{
    text-align:center;
    font-size:24px;
    font-weight:bold;
    margin-top:12px;
    word-break:break-word;
}

.uid, .region{
    text-align:center;
    color:#aaa;
    margin-top:5px;
    font-size:14px;
}

.stats{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:20px;
}

.stat{
    padding:14px;
    border-radius:12px;
    background:rgba(255,255,255,.06);
}

.stat span{
    display:block;
    color:#999;
    font-size:12px;
    margin-bottom:5px;
}

.stat strong{
    font-size:16px;
}

.footer{
    text-align:center;
    color:#666;
    font-size:12px;
    margin-top:20px;
}
</style>
</head>

<body>

<div class="container">
    <div class="logo">🔥 FREE FIRE</div>
    <div class="subtitle">UID Player Information</div>

    <input type="text" id="uid" placeholder="Enter Free Fire UID" inputmode="numeric">

    <select id="region">
        <option value="BD">🇧🇩 Bangladesh</option>
        <option value="IND">🇮🇳 India</option>
        <option value="SG">🇸🇬 Singapore</option>
        <option value="BR">🇧🇷 Brazil</option>
        <option value="US">🇺🇸 USA</option>
        <option value="PK">🇵🇰 Pakistan</option>
        <option value="ME">🌍 Middle East</option>
    </select>

    <button id="searchBtn" onclick="searchPlayer()">🔍 Search Player</button>

    <div class="loader" id="loader">
        <div class="spinner"></div>
        <p style="margin-top:10px;">Searching player...</p>
    </div>

    <div class="error" id="error"></div>

    <div class="profile" id="profile">
        <div class="avatar">👤</div>
        <div class="player-name" id="playerName">Player Name</div>
        <div class="uid" id="playerUID">UID: -</div>
        <div class="region" id="playerRegion">Region: -</div>

        <div class="stats">
            <div class="stat"><span>LEVEL</span><strong id="level">-</strong></div>
            <div class="stat"><span>BR RANK</span><strong id="rank">-</strong></div>
            <div class="stat"><span>LIKES</span><strong id="likes">-</strong></div>
            <div class="stat"><span>CS RANK</span><strong id="csrank">-</strong></div>
            <div class="stat"><span>BR POINTS</span><strong id="brpoints">-</strong></div>
            <div class="stat"><span>CS POINTS</span><strong id="cspoints">-</strong></div>
        </div>
    </div>

    <div class="footer">Free Fire UID Checker • Multi-API Gateway</div>
</div>

<script>
async function searchPlayer(){
    const uid = document.getElementById("uid").value.trim();
    const region = document.getElementById("region").value;
    const loader = document.getElementById("loader");
    const profile = document.getElementById("profile");
    const errorBox = document.getElementById("error");
    const button = document.getElementById("searchBtn");

    profile.style.display = "none";
    errorBox.style.display = "none";

    if(!uid || !/^\d+$/.test(uid) || uid.length < 6){
        showError("Please enter a valid numeric Free Fire UID.");
        return;
    }

    loader.style.display = "block";
    button.disabled = true;
    button.innerText = "⏳ Searching...";

    let playerData = null;

    // List of active API endpoints
    const apiEndpoints = [
        `https://api.uniplay.id/ff/info?uid=${uid}`,
        `https://ff-api-src.vercel.app/api/info?uid=${uid}&region=${region}`,
        `https://api.allorigins.win/get?url=${encodeURIComponent(`https://shop.garena.my/api/auth/player_id/login`)}`
    ];

    for (let index = 0; index < apiEndpoints.length; index++) {
        const url = apiEndpoints[index];
        try {
            console.log(`[Attempt ${index + 1}] Requesting:`, url);
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 6000);

            const response = await fetch(url, { signal: controller.signal });
            clearTimeout(timeoutId);

            if (response.ok) {
                let data = await response.json();
                
                if (data.contents) {
                    try { data = JSON.parse(data.contents); } catch(e){}
                }

                console.log(`[Attempt ${index + 1}] Received Data:`, data);
                const parsed = parsePlayerData(data, uid, region);
                if (parsed && parsed.nickname) {
                    playerData = parsed;
                    break;
                }
            }
        } catch (err) {
            console.warn(`[Attempt ${index + 1}] Failed:`, err.message);
        }
    }

    loader.style.display = "none";
    button.disabled = false;
    button.innerText = "🔍 Search Player";

    if (!playerData) {
        showError("⚠️ Unable to fetch data from API servers right now. Public APIs might be temporarily down or rate-limited. Try again shortly.");
        return;
    }

    // Update UI
    document.getElementById("playerName").innerText = playerData.nickname;
    document.getElementById("playerUID").innerText = "UID: " + playerData.accountId;
    document.getElementById("playerRegion").innerText = "Region: " + playerData.region;
    document.getElementById("level").innerText = playerData.level;
    document.getElementById("rank").innerText = playerData.rank;
    document.getElementById("likes").innerText = formatNumber(playerData.liked);
    document.getElementById("csrank").innerText = playerData.csRank;
    document.getElementById("brpoints").innerText = formatNumber(playerData.rankingPoints);
    document.getElementById("cspoints").innerText = formatNumber(playerData.csRankingPoints);

    profile.style.display = "block";
}

function parsePlayerData(res, defaultUid, defaultRegion) {
    if (!res) return null;
    
    // Normalize properties from different API structures
    const info = res.basicInfo || res.basicinfo || res.data?.basicInfo || res.data || res;
    const name = info.nickname || info.name || info.AccountName || info.userName || res.nickname;

    if (!name) return null;

    return {
        nickname: name,
        accountId: info.accountId || info.accountid || defaultUid,
        region: info.region || defaultRegion,
        level: info.level ?? "N/A",
        rank: info.rank ?? "N/A",
        liked: info.liked ?? info.likes ?? 0,
        csRank: info.csRank ?? info.csrank ?? "N/A",
        rankingPoints: info.rankingPoints ?? info.rankingpoints ?? 0,
        csRankingPoints: info.csRankingPoints ?? info.csrankingpoints ?? 0
    };
}

function formatNumber(val) {
    if (val === undefined || val === null || val === "" || val === "N/A") return "-";
    const num = Number(val);
    return isNaN(num) ? val : num.toLocaleString();
}

function showError(msg) {
    const errorBox = document.getElementById("error");
    errorBox.innerText = msg;
    errorBox.style.display = "block";
}

document.getElementById("uid").addEventListener("keydown", function(e) {
    if (e.key === "Enter") searchPlayer();
});
</script>

</body>
</html>
